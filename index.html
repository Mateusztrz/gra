<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nokia 3310 Retro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="phone">
        <div class="phone-top">
          <div class="speaker"></div>
          <div class="brand">NOKIA</div>
        </div>
        <div class="phone-screen">
          <div class="status-bar">
            <span class="status-left">Nokia 3310</span>
            <span class="status-right" id="statusTime">12:34</span>
          </div>
          <div class="display-window">
            <div class="screen-content" id="screenText">Wpisz wiadomość...</div>
          </div>
          <div class="screen-hint" id="screenHint">Naciśnij przycisk 2-9</div>
        </div>
      </div>
    </section>
    <input id="hiddenInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    <section class="instructions">
      <h1>Retro SMS na telefonie</h1>
      <p>Wpisuj wiadomość na fizycznej klawiaturze telefonu, a tekst pojawi się na ekranie.</p>
      <p>Dotknij ekranu, aby ustawić fokus i zacząć wpisywać.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
